services:
  api:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
        VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID:-}
        VITE_BSC_VAULT_CONTRACT: ${BSC_VAULT_CONTRACT:-}
    image: event-signal-api:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "event-signal-prototype", "--once"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  migrate:
    image: event-signal-api:production
    profiles: ["tools"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["event-signal-prototype", "--migrate-only"]
